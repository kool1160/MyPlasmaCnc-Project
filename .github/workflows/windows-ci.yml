name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-format:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MyPlasm.Inspector.sln

      - name: Build Release
        run: dotnet build MyPlasm.Inspector.sln -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test MyPlasm.Inspector.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Audit passive production native symbols
        shell: pwsh
        run: ./scripts/Test-ProductionNativeSafety.ps1

      - name: Run portable package transaction tests
        shell: pwsh
        run: ./tests/portable-package-tests.ps1

      - name: Verify formatting
        shell: pwsh
        run: |
          $env:DOTNET_HOST_PATH = (Get-Command dotnet).Source
          dotnet format MyPlasm.Inspector.sln --verify-no-changes --no-restore
