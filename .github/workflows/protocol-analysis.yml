name: Offline Protocol Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-verify:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MyPlasm.Inspector.sln

      - name: Build Release with warnings as errors
        run: dotnet build MyPlasm.Inspector.sln --configuration Release --no-restore -warnaserror

      - name: Run hardware-free tests
        run: dotnet test MyPlasm.Inspector.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Verify formatting
        run: dotnet format MyPlasm.Inspector.sln --verify-no-changes --no-restore

      - name: Run analyzer and comparison twice against invented fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capturePath = 'tests/MyPlasm.Inspector.ProtocolAnalysis.Tests/Fixtures/normal-startup.jsonl'
          $expected = (Get-FileHash -LiteralPath $capturePath -Algorithm SHA256).Hash

          dotnet run --project tools/MyPlasm.ProtocolAnalyzer --configuration Release --no-build -- `
            analyze --input $capturePath --output artifacts/analysis-first --expected-sha256 $expected
          if ($LASTEXITCODE -ne 0) { throw "First analysis failed with $LASTEXITCODE." }

          dotnet run --project tools/MyPlasm.ProtocolAnalyzer --configuration Release --no-build -- `
            analyze --input $capturePath --output artifacts/analysis-second --expected-sha256 $expected
          if ($LASTEXITCODE -ne 0) { throw "Second analysis failed with $LASTEXITCODE." }

          dotnet run --project tools/MyPlasm.ProtocolAnalyzer --configuration Release --no-build -- `
            analyze --input $capturePath --output artifacts/analysis-third --expected-sha256 $expected
          if ($LASTEXITCODE -ne 0) { throw "Third analysis failed with $LASTEXITCODE." }

          $analysisNames = @(
            'capture-summary.json',
            'capture-report.md',
            'phase-timeline.csv',
            'transaction-classes.csv',
            'payload-variability.json',
            'hashes.sha256'
          )
          foreach ($name in $analysisNames) {
            $first = (Get-FileHash -LiteralPath "artifacts/analysis-first/$name" -Algorithm SHA256).Hash
            $second = (Get-FileHash -LiteralPath "artifacts/analysis-second/$name" -Algorithm SHA256).Hash
            $third = (Get-FileHash -LiteralPath "artifacts/analysis-third/$name" -Algorithm SHA256).Hash
            if ($first -ne $second -or $first -ne $third) {
              throw "Deterministic output mismatch for $name."
            }
          }

          dotnet run --project tools/MyPlasm.ProtocolAnalyzer --configuration Release --no-build -- `
            compare `
            --analysis artifacts/analysis-first `
            --analysis artifacts/analysis-second `
            --analysis artifacts/analysis-third `
            --output artifacts/comparison-first
          if ($LASTEXITCODE -ne 0) { throw "First comparison failed with $LASTEXITCODE." }

          dotnet run --project tools/MyPlasm.ProtocolAnalyzer --configuration Release --no-build -- `
            compare `
            --analysis artifacts/analysis-third `
            --analysis artifacts/analysis-first `
            --analysis artifacts/analysis-second `
            --output artifacts/comparison-second
          if ($LASTEXITCODE -ne 0) { throw "Second comparison failed with $LASTEXITCODE." }

          $comparisonNames = @(
            'campaign-summary.json',
            'campaign-report.md',
            'stable-transaction-classes.csv',
            'class-frequency-by-run.csv',
            'run-structure-comparison.csv',
            'hashes.sha256'
          )
          foreach ($name in $comparisonNames) {
            $firstPath = "artifacts/comparison-first/$name"
            $secondPath = "artifacts/comparison-second/$name"
            $firstHash = (Get-FileHash -LiteralPath $firstPath -Algorithm SHA256).Hash
            $secondHash = (Get-FileHash -LiteralPath $secondPath -Algorithm SHA256).Hash
            if ($firstHash -ne $secondHash) {
              throw "Argument-order or repeated-run mismatch for $name."
            }

            $firstBytes = [System.IO.File]::ReadAllBytes($firstPath)
            $secondBytes = [System.IO.File]::ReadAllBytes($secondPath)
            $firstBase64 = [Convert]::ToBase64String($firstBytes)
            $secondBase64 = [Convert]::ToBase64String($secondBytes)
            if ($firstBase64 -cne $secondBase64) {
              throw "Byte comparison failed for $name."
            }
          }

          $manifestPath = 'artifacts/comparison-first/hashes.sha256'
          $manifestLines = Get-Content -LiteralPath $manifestPath |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $expectedManifestNames = $comparisonNames |
            Where-Object { $_ -ne 'hashes.sha256' } |
            Sort-Object
          $actualManifestNames = @()
          foreach ($line in $manifestLines) {
            if ($line -notmatch '^([0-9A-F]{64})  ([^\\/]+)$') {
              throw "Malformed comparison manifest entry: $line"
            }

            $manifestHash = $Matches[1]
            $manifestName = $Matches[2]
            $actualManifestNames += $manifestName
            $actualHash = (Get-FileHash -LiteralPath "artifacts/comparison-first/$manifestName" -Algorithm SHA256).Hash
            if ($manifestHash -ne $actualHash) {
              throw "Comparison manifest mismatch for $manifestName."
            }
          }
          if (($expectedManifestNames -join "`n") -cne ($actualManifestNames -join "`n")) {
            throw 'Comparison manifest has unexpected names or ordering.'
          }

          $analysisLeaks = Get-ChildItem -LiteralPath artifacts/analysis-first -File |
            Select-String -Pattern 'FACEB00C|C001D00D|SYNTHETIC-DEVICE|0x00002000'
          if ($analysisLeaks) {
            throw 'A sanitized report contains raw synthetic evidence.'
          }

          $comparisonLeakPatterns = @(
            'write_hex',
            'read_hex',
            'session_id',
            'selector_pointer',
            'serial_number',
            'SYNTHETIC-DEVICE',
            'FACEB00C',
            'C001D00D',
            '0x00002000',
            $env:GITHUB_WORKSPACE
          )
          foreach ($path in Get-ChildItem -LiteralPath artifacts/comparison-first -File) {
            $text = Get-Content -LiteralPath $path.FullName -Raw
            foreach ($pattern in $comparisonLeakPatterns) {
              if ($text.Contains($pattern, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Comparison output $($path.Name) leaked prohibited text '$pattern'."
              }
            }
          }

          Get-Content -LiteralPath $manifestPath
